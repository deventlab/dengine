[cluster]
node_id = 2
listen_address = "0.0.0.0:9082"
initial_cluster = [
    { id = 1, address = "192.168.0.11:9081", role = 1, status = 3 },
    { id = 2, address = "192.168.0.12:9082", role = 1, status = 3 },
    { id = 3, address = "192.168.0.13:9083", role = 1, status = 3 },
]


[raft]
general_raft_timeout_duration_in_ms = 100
cmd_channel_capacity = 1024
max_pending_append_responses = 1024

[raft.election]
election_timeout_min = 1000
election_timeout_max = 2000

[raft.read_consistency]
default_policy = "LeaseRead"
lease_duration_ms = 500

[raft.read_actor]
channel_capacity = 10240
max_drain = 2000

[raft.batching]
# Maximum number of commands to accumulate in a single batch during drain operations
max_batch_size = 200

[raft.metrics]
enable_backpressure = false
enable_batch = false


[raft.backpressure]
max_pending_writes = 1000
max_pending_reads = 500

[raft.persistence]
flush_policy = { Batch = { idle_flush_interval_ms = 1000 } }

[raft.snapshot]
enable = false
max_log_entries_before_snapshot = 10000
retained_log_entries = 3

# == TTL Lease Configuration ==
[raft.state_machine.lease]
cleanup_interval_ms = 1000
max_cleanup_duration_ms = 1

# == Network Control Plane (voting, heartbeat, etc.) ==
[network.control]
request_timeout_in_ms = 100
connection_window_size = 4_194_304 # Increase to 4MB to reduce flow control blocking

tcp_keepalive_in_secs = 60
http2_keep_alive_interval_in_secs = 15  # Slightly increase to reduce frequent keep-alives
http2_keep_alive_timeout_in_secs = 10   # Increase timeout

# New performance tuning parameters

# == Network Data Plane (append_entries, etc.) ==
[network.data]
connect_timeout_in_ms = 100
request_timeout_in_ms = 300
connection_window_size = 8_388_608 # Increase to 8MB to support large log entries

tcp_keepalive_in_secs = 60
http2_keep_alive_interval_in_secs = 15  # Same as control plane
http2_keep_alive_timeout_in_secs = 10

# New data plane optimizations

# == Server Transport (single listener serving every RPC type) ==
[network.server]
concurrency_limit_per_connection = 100  # Increased for higher concurrent replication load
max_concurrent_streams = 4096           # Increased to reduce stream creation overhead
max_pending_accept_reset_streams = 2000 # Higher pending stream limit for Rapid Reset mitigation

[storage]
unified_db = false
