# Node 3 Configuration - Joining Node (Dynamic Expansion)
# This node joins after node 2 has joined

[cluster]
node_id = 3
listen_address = "0.0.0.0:9083"

# List ALL nodes in the cluster (existing + self)
# Node 1: existing leader (role=2, status=3)
# Node 2: existing member (role=1, status=3) - assumes node 2 is already promoted
# Node 3: joining as learner (role=3, status=1)
initial_cluster = [
    { id = 1, address = "0.0.0.0:9081", role = 3, status = 3 }, # Existing leader
    { id = 2, address = "0.0.0.0:9082", role = 1, status = 3 }, # Existing follower (promoted)
    { id = 3, address = "0.0.0.0:9083", role = 4, status = 1 }, # Self: Learner, Joining
]



[raft]
general_raft_timeout_duration_in_ms = 100

[raft.election]
election_timeout_min = 1000
election_timeout_max = 2000

[raft.read_consistency]
default_policy = "LeaseRead"
lease_duration_ms = 500


[raft.persistence]
flush_policy = { Batch = { idle_flush_interval_ms = 20 } }

[raft.snapshot]
enable = false
max_log_entries_before_snapshot = 10000
retained_log_entries = 3

# == Network Control Plane ==
[network.control]
connection_window_size = 4_194_304
stream_window_size = 2_097_152

tcp_keepalive_in_secs = 60
http2_keep_alive_interval_in_secs = 15
http2_keep_alive_timeout_in_secs = 10


# == Network Data Plane ==
[network.data]
connect_timeout_in_ms = 100
request_timeout_in_ms = 300
connection_window_size = 8_388_608
stream_window_size = 4_194_304

tcp_keepalive_in_secs = 60
http2_keep_alive_interval_in_secs = 15
http2_keep_alive_timeout_in_secs = 10



# == Server Transport (single listener serving every RPC type) ==
[network.server]
concurrency_limit_per_connection = 100  # Increased for higher concurrent replication load
max_concurrent_streams = 4096           # Increased to reduce stream creation overhead
max_pending_accept_reset_streams = 2000 # Higher pending stream limit for Rapid Reset mitigation
